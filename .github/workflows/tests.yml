name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sqlite:
    name: PHP ${{ matrix.php }} / SQLite / ${{ matrix.dependencies }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        dependencies: [highest]
        include:
          - php: '8.2'
            dependencies: lowest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, sqlite3
          coverage: none
          tools: composer:v2

      - name: Install highest dependencies
        if: matrix.dependencies == 'highest'
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Install lowest dependencies
        if: matrix.dependencies == 'lowest'
        run: composer update --prefer-lowest --prefer-dist --no-interaction --no-progress

      - name: Validate Composer manifest
        run: composer validate --strict

      - name: Run tests
        run: composer test

      - name: Run static analysis
        if: matrix.php == '8.4' && matrix.dependencies == 'highest'
        run: composer analyse

  mariadb:
    name: PHP 8.4 / MariaDB
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: seed_tracker
          MARIADB_USER: seed_tracker
          MARIADB_PASSWORD: seed_tracker
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      database.tests.hostname: 127.0.0.1
      database.tests.database: seed_tracker
      database.tests.username: seed_tracker
      database.tests.password: seed_tracker
      database.tests.DBDriver: MySQLi
      database.tests.DBPrefix: test_
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, mysqli
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: composer test
